{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "talon.secretName" . }}
  labels:
    {{- include "talon.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.claudeCodeOAuthToken }}
  # Optional: long-lived token from `claude setup-token`. Default deployment
  # instead seeds claude.ai Max credentials on the PVC (README: First-boot auth).
  CLAUDE_CODE_OAUTH_TOKEN: {{ .Values.secrets.claudeCodeOAuthToken | b64enc | quote }}
  {{- end }}
  # Per-agent bot tokens and service credentials, keyed by env var name.
  # Bot tokens are consumed by the supervisor via botTokenEnvVar in
  # runtime/agents.yaml; the rest are aliased per agent there.
  {{- range $key, $value := .Values.secrets.extra }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
